[project]
name = "ictalx"
version = "0.1.0"
description = "Seizure detection for single-channel mouse EEG"
requires-python = ">=3.10,<3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = [
    "slow: long end-to-end runs (m427 takes about 1 hour on a laptop CPU)",
    "browser: interface test in Microsoft Edge via Playwright (about 2 minutes)",
]
addopts = "-m 'not slow and not browser'"
