[project]
name = "ictalx"
version = "0.1.0"
description = "Seizure detection for single-channel mouse EEG"
requires-python = ">=3.10,<3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = ["slow: long end-to-end runs (m427 takes about 90 minutes on CPU)"]
addopts = "-m 'not slow'"
