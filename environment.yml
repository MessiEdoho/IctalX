# Create with:  conda env create -f environment.yml
# Remove with:  conda env remove -n ictalx
name: ictalx
channels:
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.5.1
      - numpy==2.2.5
      - scipy==1.15.3
      - mne==1.11.0
      - pandas==2.3.3
      - fastapi==0.162.0
      - uvicorn[standard]==0.54.0
      - python-multipart==0.0.32
      - matplotlib==3.10.9
      - pytest
      - httpx==0.28.1     # used by the API tests
      - pyflakes          # code check, development only
